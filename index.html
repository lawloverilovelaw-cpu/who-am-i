<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020503; --panel:#07110a; --green:#00ff66; --dim:#12a24c; --line:#0d3a1d; --bad:#ff4d4d;
  color-scheme:dark; box-sizing:border-box;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--green);
  font:400 1rem/1.7 "Fira Code",ui-monospace,Menlo,Consolas,monospace;
  text-shadow:0 0 6px rgba(0,255,102,.35)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:300;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
h1,h2,h3{font-weight:700;margin:0;line-height:1.2}
p{margin:.4rem 0;max-width:42rem}
.hidden{display:none !important}
.dim{color:var(--dim)}
.cursor::after{content:"█";margin-left:.2em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.btn{display:inline-block;margin-top:.8rem;background:transparent;color:var(--green);border:1px solid var(--green);
  font:500 1rem "Fira Code",ui-monospace,monospace;padding:.55rem 1.1rem;text-decoration:none;cursor:pointer;
  text-shadow:inherit}
.btn:hover{background:var(--green);color:var(--bg);text-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;background:transparent;color:var(--green)}
a{color:var(--green)}
a:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}

/* Boot screen */
#intro{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;
  padding:1.5rem calc(1.25rem + env(safe-area-inset-right,0px)) 1.5rem calc(1.25rem + env(safe-area-inset-left,0px));
  transition:opacity .6s ease}
#intro.off{opacity:0;pointer-events:none}
#boot{max-width:40rem;margin:0 auto;width:100%;min-height:9rem;white-space:pre-wrap}

/* Quiz */
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;
  padding:calc(2rem + env(safe-area-inset-top,0px)) 1.25rem calc(2rem + env(safe-area-inset-bottom,0px))}
#gate .box{max-width:36rem;margin:0 auto}
#gate h1{font-size:clamp(1.5rem,6vw,2.2rem)}
.q{border:1px solid var(--line);background:var(--panel);padding:1rem 1.1rem;margin:1rem 0}
.q legend{font-weight:700;padding:0 .4rem}
.q label{display:block;padding:.3rem 0;cursor:pointer}
.q input{margin-right:.6rem;accent-color:var(--green)}
#msg{min-height:1.7rem;font-weight:700}
#msg.bad{color:var(--bad);text-shadow:0 0 6px rgba(255,77,77,.4)}

/* Website */
main{max-width:48rem;margin:0 auto;
  padding:calc(2.5rem + env(safe-area-inset-top,0px)) 1.25rem calc(4rem + env(safe-area-inset-bottom,0px))}
header{padding-bottom:2rem;border-bottom:1px dashed var(--dim)}
header h1{font-size:clamp(2rem,8vw,3.6rem);letter-spacing:-.02em}
section{padding:2rem 0;border-bottom:1px dashed var(--line)}
section h2{font-size:1.3rem;margin-bottom:.8rem}
.games{display:grid;gap:1rem}
.game{border:1px solid var(--green);background:var(--panel);padding:1.1rem 1.25rem}
.game h3{font-size:1.15rem}
.game p{color:var(--dim)}
.contact-list{list-style:none;padding:0;margin:0}
.contact-list li{padding:.25rem 0}
footer{padding-top:1.5rem;color:var(--dim);font-size:.9rem}

@media (prefers-reduced-motion:reduce){
  .cursor::after{animation:none}
  #intro{transition:none}
}
</style>
</head>
<body>

<div id="intro" aria-hidden="true"><div id="boot" class="cursor"></div></div>

<div id="gate" class="hidden">
  <div class="box">
    <h1>&gt; ACCESS CHECK</h1>
    <p class="dim">Answer all 3 questions to get in. If you fail, refresh the page and try again.</p>
    <form id="quiz" onsubmit="return false"></form>
    <p id="msg" role="status"></p>
    <button class="btn" id="check" type="button">[ enter ]</button>
  </div>
</div>

<main id="site" class="hidden">
  <header>
    <h1 id="siteName"></h1>
    <p class="dim" id="siteTagline"></p>
  </header>
  <section>
    <h2>&gt; about</h2>
    <div id="aboutBox"></div>
  </section>
  <section>
    <h2>&gt; my_games</h2>
    <div class="games" id="gamesBox"></div>
  </section>
  <section>
    <h2>&gt; contact</h2>
    <ul class="contact-list" id="contactBox"></ul>
  </section>
  <footer id="footer"></footer>
</main>

<script>
/* ==========================================================
   EDIT EVERYTHING HERE. You don't need to touch anything below.
   ========================================================== */
var CONFIG = {

  name: "Yuan",

  // One short line under your name
  tagline: "one of fortress official creator",

  // Your comment about yourself. Add or remove lines, each one is a paragraph.
  about: [
    "why would you ever find this websiste?i'm yuan,i probably won't leave much infomation of me here,so good luck for you if you are trying to find who am i,since not much people in school know me",

  ],

  // Your games. Copy a { ... }, block to add another one.
  // Leave link as "" if the game has no link yet.
  games: [
    { title: "Fortressed", text: "a game plateform", link: "https://fortressed.onrender.com" },

  ],

  // Contact lines. "link" is optional (use "mailto:you@example.com" for email).
  contact: [
    { label: "Discord", value: "no discord yet,there will be one in future", link: "" },
    { label: "Email",   value: "lawlover.ilovelaw@gmail.com", link: "" }
  ],

  // Quiz: set to false to let everyone in without questions.
  useQuiz: true,

  // answer = number of the correct option (1 to 4)
  questions: [
    { q: "Which game is mine?",
      options: ["Tribe Defence", "Drift Bloom", "Chero", "Base Siege"], answer: 4 },
  ],

  // Text typed on the boot screen. Use {name} to insert your name.
  bootLines: [
    "> booting system...",
    "> loading profile: {Yuan}",
    "> checking visitor...",
    "> welcome."
  ]
};
/* ========================================================== */

(function(){
  var C = CONFIG;
  var KEY = "intro_quiz_passed";
  var $ = function(id){ return document.getElementById(id); };
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  /* Fill the page from CONFIG */
  document.title = C.name;
  $("siteName").textContent = C.name;
  $("siteTagline").textContent = C.tagline;
  $("footer").textContent = "© " + C.name;

  C.about.forEach(function(t){ $("aboutBox").appendChild(el("p", "", t)); });

  C.games.forEach(function(g){
    var box = el("div", "game");
    box.appendChild(el("h3", "", g.title));
    box.appendChild(el("p", "", g.text));
    if (g.link) {
      var a = el("a", "btn", "[ play " + g.title + " ]");
      a.href = g.link; a.target = "_blank"; a.rel = "noopener";
      box.appendChild(a);
    }
    $("gamesBox").appendChild(box);
  });

  C.contact.forEach(function(c){
    var li = el("li");
    li.appendChild(el("span", "dim", c.label + ": "));
    if (c.link) {
      var a = el("a", "", c.value);
      a.href = c.link; a.target = "_blank"; a.rel = "noopener";
      li.appendChild(a);
    } else {
      li.appendChild(document.createTextNode(c.value));
    }
    $("contactBox").appendChild(li);
  });

  /* Quiz */
  var quiz = $("quiz"), msg = $("msg"), btn = $("check");
  C.questions.forEach(function(item, i){
    var fs = el("fieldset", "q");
    fs.appendChild(el("legend", "", (i + 1) + ". " + item.q));
    item.options.forEach(function(opt, j){
      var lab = el("label");
      var inp = document.createElement("input");
      inp.type = "radio"; inp.name = "q" + i; inp.value = String(j + 1);
      lab.appendChild(inp);
      lab.appendChild(document.createTextNode(opt));
      fs.appendChild(lab);
    });
    quiz.appendChild(fs);
  });

  function showSite(){
    $("gate").classList.add("hidden");
    $("site").classList.remove("hidden");
  }

  btn.addEventListener("click", function(){
    var wrong = 0, blank = 0;
    C.questions.forEach(function(item, i){
      var p = quiz.querySelector('input[name="q' + i + '"]:checked');
      if (!p) { blank++; return; }
      if (Number(p.value) !== item.answer) wrong++;
    });
    if (blank) {
      msg.className = "bad";
      msg.textContent = "ERROR: answer all " + C.questions.length + " questions.";
      return;
    }
    if (wrong) {
      quiz.querySelectorAll("input").forEach(function(x){ x.disabled = true; });
      btn.disabled = true;
      msg.className = "bad";
      msg.textContent = "ACCESS DENIED. Refresh the page to try again.";
      return;
    }
    try { localStorage.setItem(KEY, "yes"); } catch (e) {}
    showSite();
  });

  /* Boot animation: types each line, then opens the site or the quiz */
  var boot = $("boot");
  var lines = C.bootLines.map(function(l){ return l.replace("{name}", C.name); });
  var speed = reduce ? 1 : 28;
  var li = 0, ci = 0, shown = "";

  function finish(){
    var passed = false;
    try { passed = localStorage.getItem(KEY) === "yes"; } catch (e) {}
    if (!C.useQuiz || passed) showSite(); else $("gate").classList.remove("hidden");
    $("intro").classList.add("off");
    setTimeout(function(){ $("intro").classList.add("hidden"); }, 700);
  }

  function tick(){
    if (li >= lines.length) { setTimeout(finish, reduce ? 0 : 600); return; }
    var line = lines[li];
    if (ci < line.length) {
      ci++;
      boot.textContent = shown + line.slice(0, ci);
      setTimeout(tick, speed);
    } else {
      shown += line + "\n";
      li++; ci = 0;
      setTimeout(tick, reduce ? 0 : 280);
    }
  }
  tick();
})();
</script>
</body>
</html>
